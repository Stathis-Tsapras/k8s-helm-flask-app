apiVersion: v1
kind: Pod
metadata:
 name: postgres-probe-test
spec:
 restartPolicy: Always
 containers:
 - name: postgres
   image: postgres:16
   env:
   - name: POSTGRES_DB
     value: appdb
   - name: POSTGRES_USER
     value: appuser
   - name: POSTGRES_PASSWORD
     valueFrom:
      secretKeyRef:
       name: app-secret
       key: DB_PASSWORD
   - name: FLASK_DB_PASSWORD
     valueFrom:
      secretKeyRef:
       name: app-secret
       key: FLASK_DB_PASSWORD
   volumeMounts:
   - name: test-data
     mountPath: /var/lib/postgresql/data
   - name: postgres-init
     mountPath: /docker-entrypoint-initdb.d
     readOnly: true
   readinessProbe:
    exec:
     command:
      - sh
      - -c
     # - 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t 2'
      - 'test ! -f /tmp/fail-ready && pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t 2'
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3 

 volumes:
 - name: test-data
   emptyDir: {}
 - name: postgres-init
   configMap:
    name: postgres-init 
