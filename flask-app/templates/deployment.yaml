apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  labels:
    
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            -  containerPort: {{ .Values.service.port }}
          env:
           - name: POSTGRES_HOST
             valueFrom:
              configMapKeyRef:  
               name: flask-config
               key: POSTGRES_HOST
           - name: POSTGRES_DB
             valueFrom:
                configMapKeyRef:
                 name: flask-config
                 key: POSTGRES_DB
           - name: POSTGRES_USER
             valueFrom:
              configMapKeyRef:
               name: flask-config
               key: POSTGRES_USER
           - name: POSTGRES_PASSWORD
             valueFrom:
              secretKeyRef:
               name: app-secret
               key: DB_PASSWORD  

          readinessProbe:
           httpGet:
            path: /ready
            port: 5000
           initialDelaySeconds: 5
           periodSeconds: 5
           timeoutSeconds: 3
           failureThreshold: 3
          livenessProbe:
           httpGet:
            path: /health
            port: 5000
           initialDelaySeconds: 10
           periodSeconds: 10
           timeoutSeconds: 3
           failureThreshold: 3
