apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: postgres
  name: postgres
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: postgres
  strategy:
    rollingUpdate:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - env:
        - name: POSTGRES_PASSWORD
          valueFrom:
           secretKeyRef:
            name: app-secret
            key: DB_PASSWORD
        - name: POSTGRES_DB
          value: {{ .Values.postgres.database | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.postgres.username | quote }}
        - name: FLASK_DB_PASSWORD
          valueFrom:
           secretKeyRef:
            name: app-secret
            key: FLASK_DB_PASSWORD
        image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
        imagePullPolicy: IfNotPresent
        name: postgres
        volumeMounts:
         - name: postgres-data
           mountPath: /var/lib/postgresql/data
         - name: postgres-init
           mountPath: /docker-entrypoint-initdb.d
           readOnly: true
        resources:
         requests:
          cpu: 100m
          memory: 256Mi
         limits:
          cpu: "1"
          memory: 512Mi
        readinessProbe:
         exec:
          command:
           - sh
           - -c
           - 'pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRE_USER" -d "$POSTGRES_DB" -t 2'
         periodSeconds: 5
         timeoutSeconds: 3
         failureThreshold: 3
        startupProbe:
         exec:
          command:
           - sh
           - -c
           - 'pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t 2'
         periodSeconds: 5
         timeoutSeconds: 3
         failureThreshold: 60
        livenessProbe:
         exec:
          command:
           - sh
           - -c
           - 'pg_isready -h  127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t 2'
         periodSeconds: 10
         timeoutSeconds: 3
         failureThreshold: 6 
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
         claimName: postgres-data
      - name: postgres-init
        configMap:
         name: postgres-init

